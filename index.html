<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pesca Selvagem — Simulador</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--bg:#e8f7ff;--fg:#17324d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1b2a;--fg:#e8f4ff}}
:root[data-theme="dark"]{--bg:#0d1b2a;--fg:#e8f4ff}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font-family:Inter,system-ui,sans-serif;display:flex;align-items:center;justify-content:center}
#g{position:relative;width:min(100%,1100px);aspect-ratio:960/600;max-height:100%;border:1px solid #71808a;border-radius:12px;overflow:hidden;box-shadow:0 24px 70px #0009;user-select:none;touch-action:none;background:#102b3b}
canvas{width:100%;height:100%;display:block;cursor:crosshair}
#hud{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:7px;flex-wrap:wrap;align-items:center;pointer-events:none;font-weight:700;font-size:clamp(10px,1.45vw,14px);z-index:3}
.pill{background:linear-gradient(145deg,#102f3def,#081c2bdf);color:#f6f4e9;padding:8px 11px;border:1px solid #d8e8df55;border-radius:10px;box-shadow:0 4px 14px #0006,inset 0 1px #ffffff18;backdrop-filter:blur(10px);text-shadow:0 1px 2px #0008;white-space:nowrap}
.pill span{color:#f4d27e;font-variant-numeric:tabular-nums}
#hud button{pointer-events:auto;margin-left:auto;border-radius:9px;padding:8px 12px;background:linear-gradient(145deg,#f3d18a,#b58a4e);border:1px solid #fff8;box-shadow:0 3px 0 #735331,0 5px 12px #0005;font-size:inherit}#hud button+button{margin-left:0}
@media(max-width:620px){#hud{gap:5px;top:6px;left:6px;right:6px}.pill{padding:6px 8px}#hud button{padding:6px 8px}}
#book{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#071522d9;color:#f7efd9;padding:18px;overflow:auto;z-index:5}
#book.on{display:flex}.bookpage{width:min(760px,100%);max-height:100%;overflow:auto;background:linear-gradient(135deg,#ead9ae,#c9ae7d);color:#3c3020;border:9px solid #765536;border-radius:12px;padding:20px;box-shadow:0 15px 50px #000b}
.bookpage h2{text-align:center;font-family:Georgia,serif;font-size:clamp(24px,4vw,36px);margin:0 0 5px}
.booksub{text-align:center;font-family:Georgia,serif;margin:0 0 14px}
.bookgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.species{background:#fff8e5a8;border:1px solid #8b714b;border-radius:7px;padding:9px;min-height:75px;font-family:Georgia,serif}
.species.unknown{opacity:.62;background:#b5a582}
.species b{display:block;font-size:14px}.species small{display:block;margin-top:5px}
.bookfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px}
.bookpage button{background:#536b4c;color:#fff5dc;box-shadow:0 3px #314331}
@media(max-width:560px){.bookgrid{grid-template-columns:1fr 1fr}.bookpage{padding:12px;border-width:6px}}
button{font:inherit;font-weight:700;border:1px solid #ffffff35;border-radius:5px;padding:8px 16px;background:#c4a66b;color:#182a2d;cursor:pointer;box-shadow:0 3px #79623c;transition:transform .1s}
button:hover{transform:translateY(-2px)}button:active{transform:translateY(2px);box-shadow:0 1px #a68b4b}button:disabled{background:#ccc;color:#777;box-shadow:0 4px #999;cursor:not-allowed}
.ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#0d1f33dd;color:#fff;text-align:center;padding:12px;overflow:auto}
.ov.on{display:flex}.box{display:flex;flex-direction:column;gap:12px;align-items:center;max-width:680px;width:100%}
h1{font-size:clamp(28px,6vw,54px);margin:0;color:#e9e3cf;text-shadow:0 3px 18px #000}h2,h3{margin:4px 0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.card{background:linear-gradient(145deg,#ffffff20,#06152280);border:1px solid #ffffff2b;border-radius:13px;padding:12px;display:flex;flex-direction:column;gap:6px;font-size:14px;box-shadow:0 6px 18px #0003}.card hr{width:100%;opacity:.3}.cur{color:#f1e2b0;font-weight:700}
.inv{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:100%;font-size:13px}
.it{background:#fff2;border-radius:10px;padding:4px 8px;display:flex;gap:6px;align-items:center}.it i{width:12px;height:12px;border-radius:50%;flex:none}.it b{margin-left:auto}.lk{opacity:.5}

/* Loja: painel de compras mais claro e organizado */
#shop{background:radial-gradient(ellipse at 50% 0%,#31556bdc,#071522f2 72%);backdrop-filter:blur(7px);padding:clamp(10px,3vw,28px);z-index:6}
#shop .box{max-width:900px;max-height:100%;overflow:auto;align-items:stretch;gap:14px;padding:clamp(14px,2.5vw,24px);border:1px solid #e9d49a66;border-radius:20px;background:linear-gradient(145deg,#193b4bfa,#0b202ff5 65%,#172c35fa);box-shadow:0 22px 65px #000b,inset 0 1px #fff2}
.shophead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.shophead h2{font-size:clamp(23px,4vw,34px);color:#f6e8c3;margin:0;text-shadow:0 3px 12px #0008}
.wallet{display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:13px;background:linear-gradient(135deg,#f4d98d,#b98a43);color:#352713;font-weight:800;box-shadow:0 4px 0 #74552d,0 8px 18px #0004}
.wallet strong{font-size:19px;font-variant-numeric:tabular-nums}
.shopintro{margin:0;color:#c4d6d9;font-size:13px;text-align:left}
.shopgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:100%}
.shopcard{position:relative;overflow:hidden;text-align:left;align-items:stretch;background:linear-gradient(155deg,#ffffff18,#071723a8);border:1px solid #d9e8dc35;border-radius:16px;padding:15px;gap:9px;box-shadow:0 8px 22px #0003}
.shopcard:before{content:"";position:absolute;inset:0 0 auto;height:3px;background:linear-gradient(90deg,#e8c77b,#78b5ad,#e8c77b)}
.shopcardtop{display:flex;align-items:center;gap:9px}
.shopicon{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;background:#f1d69b20;border:1px solid #f1d69b50;font-size:24px}
.shopcard h3{font-size:17px;color:#f4e6c4;margin:0}
.shoplevel{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#9fc3bd;font-weight:800}
.shopcurrent{padding:9px 10px;border-radius:10px;background:#0617228c;border:1px solid #ffffff16}
.shopcurrent b{display:block;color:#f5d58b;font-size:14px}
.shopcurrent small,.shopnext small{display:block;color:#c2d1d2;margin-top:3px;line-height:1.4}
.shoparrow{text-align:center;color:#e6c77e;font-size:18px;line-height:1}
.shopnext{min-height:62px}
.shopnext b{color:#fff1cf}
.shopprice{display:flex;justify-content:space-between;align-items:center;gap:8px;color:#f3d68e;font-weight:800;font-size:15px}
.shopcard button{width:100%;border:1px solid #fff7;border-radius:10px;padding:10px;background:linear-gradient(135deg,#f5df9e,#c99b51);color:#302514;box-shadow:0 4px 0 #79582e;font-weight:800}
.shopcard button:disabled{background:#45545a;color:#aab7b7;border-color:#ffffff20;box-shadow:none}
.shopmax{padding:10px;border-radius:10px;text-align:center;background:#3d765c55;color:#b8e6c4;font-weight:800}
.shopsection{display:flex;align-items:center;justify-content:space-between;gap:10px;color:#f1e4c5;text-align:left}
.shopsection h3{margin:0;font-size:16px}
.shopsection small{color:#aac0c4}
.shopinv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;width:100%}
.shopinv .it{background:#ffffff12;border:1px solid #ffffff12;border-radius:9px;padding:8px;font-size:12px;color:#e9eeee;min-width:0}
.shopinv .it b{color:#f2d78e}
.shopback{align-self:center;min-width:190px;background:linear-gradient(135deg,#d9e4d3,#8da991);color:#18312c;border-radius:11px;padding:10px 20px;box-shadow:0 4px 0 #49634d}
@media(max-width:680px){.shopgrid{grid-template-columns:1fr}.shopcard{padding:12px}.shopnext{min-height:0}.shopinv{grid-template-columns:repeat(2,minmax(0,1fr))}}

#toast{position:absolute;bottom:60px;left:50%;transform:translateX(-50%);background:#e9dcae;color:#3d2e12;padding:8px 18px;border-radius:6px;font-weight:700;opacity:0;transition:opacity .3s;pointer-events:none}#toast.on{opacity:1}
@media(max-width:560px){.grid,.inv{grid-template-columns:1fr 1fr}}
</style></head><body>
<div id="g">
<canvas id="c" width="960" height="600"></canvas>
<div id="hud"><span class="pill">$ <span id="hc">0</span></span><span class="pill">Pontos <span id="hs">0</span></span><span class="pill">Prof. <span id="hd">0</span></span><span class="pill">Peixes <span id="hk">0</span></span><span class="pill">🎣 <span id="hr">Galho</span></span><span class="pill">🪱 <span id="hb">Minhoca</span></span><button id="bs">Loja (S)</button><button id="bn">Caderno</button><button id="bp">Pausa (P)</button></div>
<div id="toast"></div>
<div class="ov on" id="menu"><div class="box"><h1>Pesca Selvagem</h1><p>Um simulador de pesca em águas naturais. Escolha o ponto, controle a linha e traga sua captura até o barco.</p><button id="play" style="font-size:26px;padding:12px 40px">Jogar</button><small>MOUSE / ← → mover anzol  •  CLIQUE / ESPAÇO lançar e recolher  •  SEGURE para aliviar a tensão  •  S loja  •  P pausa</small></div></div>
<div class="ov" id="pause"><div class="box"><h1>Pausado</h1><button id="resume">Continuar</button><button id="restart">Reiniciar (apaga progresso)</button></div></div>
<div class="ov" id="shop"><div class="box"></div></div>
<div id="book"><div class="bookpage" id="bookpage"></div></div>
</div>
<script>
const $=i=>document.getElementById(i),C=$('c'),X=C.getContext('2d'),W=960,H=600,SURF=190,TX=590,TY=-95,IDLE=-70;
const R=Math.random,rr=(a,b)=>a+R()*(b-a),cl=(v,a,b)=>Math.max(a,Math.min(b,v));
let AC;function snd(f,d=.12,t='sine',v=.1,s=0){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime;o.type=t;o.frequency.setValueAtTime(f,n);if(s)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+s),n+d);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(n+d)}catch(e){}}
// nome,cor1,cor2,tamanho,velocidade,valor,profMin,profMax,luta,peso
const SP=[['Lambari','#7d8c58','#e8e4cc','#2f3b24',17,50,5,30,330,0,10,.3,'std'],['Sardinha','#4f7a9a','#e3edf2','#1f3a52',19,70,8,40,350,0,9,.26,'std'],['Peixe-palhaço','#e8742a','#f4a35c','#ffffff',21,45,14,60,400,.5,6,.4,'clown'],['Baiacu','#c9b45e','#f1e8b8','#6b5a22',27,35,22,150,600,1,5,.62,'puff'],['Atum','#2f4f7a','#d9e4ee','#e0c13a',40,80,40,250,800,1.5,5,.34,'tuna'],['Peixe-lua','#9aa7b5','#e4e8ec','#6e7c8c',46,40,60,300,900,2,3,.8,'sun'],['Arraia','#8c7a5a','#e9dfca','#5c4c34',56,55,100,450,1200,2.5,3,.4,'ray'],['Tubarãozinho','#6d7d8a','#e6ebee','#46535d',64,90,130,500,1300,3,3,.28,'shark'],['Peixe-espada','#3d6f86','#cfdfe6','#243f50',74,110,170,600,1400,3.5,2,.2,'sword'],['Carpa Dourada','#d99a1e','#f6dc8a','#9a6410',60,70,400,350,950,4,1.2,.4,'carp'],['Dragão-do-Mar','#b5413a','#efb59a','#6e1f1c',86,100,800,900,1600,5.5,.8,.26,'dragon'],['Lanterna Real','#5b3d8f','#c9b6e6','#f2e27a',82,60,1500,1400,2100,7,.6,.46,'lamp']].map(a=>({n:a[0],c1:a[1],c2:a[2],c3:a[3],sz:a[4],spd:a[5],val:a[6],d0:a[7],d1:a[8],fight:a[9],w:a[10],hh:a[11],k:a[12],leg:a[6]>=400}));
const UP={rod:{t:'Vara',L:[['Vara de Galho','Pega 1 peixe • Força 1',0],['Vara de Bambu','Pega 2 peixes • Força 2',60],['Vara de Fibra','Pega 3 peixes • Força 3',220],['Vara Profissional','Pega 4 peixes • Força 5',650],['Vara Lendária','Pega 5 peixes • Força 7',1900]],cap:[1,2,3,4,5],pw:[1,2,3,5,7]},
line:{t:'Linha',L:[['Linha de 35 m','Águas rasas',0],['Linha de 60 m','Mais fundo',90],['Linha de 95 m','Águas médias',260],['Linha de 140 m','Zona profunda',750],['Linha de 200 m','Abismo!',2100]],len:[350,600,950,1400,2000]},
bait:{t:'Isca',L:[['Minhoca','Atrai peixes próximos',0],['Camarão brilhante','Mais alcance e raros +50%',50],['Isca dourada','Muito alcance, raros ×2',320],['Isca mística','Atrai lendários!',1100]],att:[60,100,140,190],bst:[1,1.5,2.3,4]}};
const BC=['#e57373','#ff8a65','#ffd54f','#ba68c8'];
let G,mode='menu',paused=false,shop=false,keys={},mx=TX,mouse=false,T=0,cam=0,happy=0,hk,fish,hooked,parts,pops,prevY=IDLE,tt;
const fresh=()=>({coins:0,score:0,rod:0,line:0,bait:0,inv:{}});
function load(){try{const s=JSON.parse(localStorage.getItem('apg'));if(s)return Object.assign(fresh(),s)}catch(e){}return fresh()}
function save(){try{localStorage.setItem('apg',JSON.stringify(G))}catch(e){}}
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2400)}
function resetRun(){hk={x:TX,y:IDLE,st:'idle'};fish=[];hooked=[];parts=[];pops=[];for(let i=0;i<22;i++)spawn(true)}
function spawn(init){const len=UP.line.len[G.line];for(let k=0;k<12;k++){const y=init?rr(40,len*.6):rr(Math.max(40,hk.y-350),Math.min(len+150,hk.y+550));if(y<40)continue;const c=SP.filter(s=>y>=s.d0&&y<=s.d1);if(!c.length)continue;const b=UP.bait.bst[G.bait];let tot=0;const ws=c.map(s=>{const w=s.w*(s.fight>=2?b:1);tot+=w;return w});let r=R()*tot,s=c[0];for(let i=0;i<c.length;i++){r-=ws[i];if(r<=0){s=c[i];break}}const d=R()<.5?1:-1;fish.push({s,x:init?rr(0,W):(d>0?-150:W+150),y,d,sp:s.spd*rr(.8,1.2),ph:R()*7,imm:0,shy:R()<Math.max(0,.9-G.bait*.25),sz:s.sz*rr(.9,1.1),vy:0});return}}
const pop=(x,y,t)=>pops.push({x,y,t,l:1.6});
function splash(x){snd(220,.25,'triangle',.12,-120);for(let i=0;i<10;i++)parts.push({k:'s',x,y:0,vx:rr(-80,80),vy:rr(-160,-60),l:.8,r:rr(2,4)})}
function action(){if(mode!=='play'||paused||shop)return;if(hk.st==='idle'){hk.st='down';hk.y=IDLE+1;snd(500,.15,'square',.08,300)}else if(hk.st==='down'){hk.st='up';armed=false;snd(400,.1,'square',.06)}}
function land(){hk.st='idle';let sum=0;hooked.forEach((f,i)=>{const n=f.s.n;if(!G.inv[n])toast('Nova espécie: '+n+'!');G.inv[n]=(G.inv[n]||0)+1;sum+=f.s.val;pop(TX-40+i*24,-70-i*14,'+$'+f.s.val)});if(sum){G.coins+=sum;G.score+=sum;happy=1.8;[660,880,1320].forEach((f,i)=>setTimeout(()=>snd(f,.18,'square',.08),i*110));for(let i=0;i<16;i++)parts.push({k:'p',x:TX,y:-60,vx:rr(-120,120),vy:rr(-220,-60),l:1,r:rr(3,6)})}hooked=[];save()}
let tens=0,armed=true,md=false,reelAcc=0,brk=0,shk=0;
function tension(dt,pw){let tg=0;if(!(keys.Space||md))armed=true;const sl=hk.st==='up'&&armed&&hooked.length&&(keys.Space||md);
 hooked.forEach(f=>{f.age+=dt;f.tm-=dt;if(f.tm<=0){f.th=!f.th;f.tm=f.th?rr(.5,1.3):rr(1,2.6)}
  const it=(f.s.fight/7*.85+.1)*(1-.4*Math.min(1,f.age/10));f.thr+=((f.th?1:0)-f.thr)*Math.min(1,7*dt);f.pull=f.thr*it*1.7*(1.15-pw*.09)+it*.12;tg+=f.pull;hk.x=cl(hk.x+Math.sin(T*11+f.ph)*f.thr*f.pull*90*dt,30,W-30)});
 const tgt=hk.st==='up'?(sl?tg*.15:tg):0;tens=cl(tens+(tgt-tens)*Math.min(1,(tgt>tens?5:3)*dt),0,1.2);
 if(tens>=1&&hooked.length){brk+=dt;if(brk>.3){brk=0;const f=hooked.reduce((a,b)=>b.pull>a.pull?b:a);hooked.splice(hooked.indexOf(f),1);Object.assign(f,{imm:3,x:hk.x,y:hk.y+20,d:R()<.5?1:-1,sp:f.s.spd*2.2,dead:0});fish.push(f);pop(hk.x,hk.y-10,'A linha estalou!');snd(180,.4,'sawtooth',.12,-100);tens=.3;shk=1}}else brk=Math.max(0,brk-dt)}
function feel(dt){shk=Math.max(0,shk-dt*3);const v=Math.max(tens*tens*.9,shk);
 try{const gp=navigator.getGamepads&&navigator.getGamepads()[0];if(gp&&gp.vibrationActuator&&v>.15&&(feel.t=(feel.t||0)-dt)<=0){feel.t=.1;gp.vibrationActuator.playEffect('dual-rumble',{duration:120,strongMagnitude:v,weakMagnitude:v*.6})}
 if(navigator.vibrate&&v>.3&&(feel.n=(feel.n||0)-dt)<=0){feel.n=.15;navigator.vibrate(Math.round(30+v*70))}}catch(e){}
 try{if(AC){if(!feel.o){feel.o=AC.createOscillator();feel.g=AC.createGain();feel.o.type='sawtooth';feel.g.gain.value=0;feel.o.connect(feel.g);feel.g.connect(AC.destination);feel.o.start()}feel.o.frequency.value=90+tens*320+Math.sin(T*30)*tens*20;feel.g.gain.value=hooked.length&&mode==='play'?tens*tens*.05:0}}catch(e){}}
function update(dt){
 T+=dt;happy-=dt;cam+=((hk.st==='idle'?0:cl(hk.y-300,0,3000))-cam)*Math.min(1,4*dt);
 const cap=UP.rod.cap[G.rod],pw=UP.rod.pw[G.rod],len=UP.line.len[G.line];
 const mv=(keys.ArrowRight||keys.KeyD?1:0)-(keys.ArrowLeft||keys.KeyA?1:0);
 if(hk.st!=='idle'&&mode==='play'){
  if(mv){hk.x+=mv*300*dt;mouse=false}else if(mouse)hk.x+=cl(mx-hk.x,-330*dt,330*dt);hk.x=cl(hk.x,30,W-30);
  if(hk.st==='down'){hk.y+=200*dt;if(hk.y>=len||hooked.length>=cap){hk.st='up';armed=true}}
  else{const ld=hooked.reduce((a,f)=>a+f.sz/40,0),sl=armed&&hooked.length&&(keys.Space||md),sp=sl?0:(190+28*pw)/(1+.15*ld)*(1-Math.min(1,tens)*.55);hk.y+=((sl?hooked.reduce((a,f)=>a+f.pull,0)*35:0)-sp)*dt;hk.y=Math.min(hk.y,len);reelAcc+=sp*dt;if(reelAcc>12){reelAcc=0;snd(1700+R()*200,.02,'square',.02)}if(hk.y<=IDLE)land()}
  if((prevY<=0)!==(hk.y<=0))splash(hk.x)
 }else{hk.x+=(TX-hk.x)*5*dt;hk.y=IDLE+Math.sin(T*2)*3;if(hk.st!=='idle')hk.st='idle'}
 prevY=hk.y;
 for(const f of fish){f.imm-=dt;f.x+=f.d*f.sp*dt;f.y+=(Math.sin(T*2+f.ph)*12+f.vy)*dt;f.vy*=.97;
  if(hk.st!=='idle'&&f.imm<=0){const dx=hk.x-(f.x+f.d*f.sz*.8),dy=hk.y-f.y,d=Math.hypot(dx,dy);
   if(d<UP.bait.att[G.bait]+f.sz*.3&&d>1){if(f.shy&&f.s.fight>=3){if(d<130)f.vy=-Math.sign(dy)*160}else{f.vy=Math.sign(dy)*Math.min(70,Math.abs(dy)*2);if(Math.abs(dx)>14)f.d=dx>0?1:-1}}
   if(d<14+f.sz*.3&&hooked.length<cap){hooked.push(f);f.dead=1;f.thr=0;f.age=0;f.tm=rr(.3,1);f.th=false;f.pull=0;snd(800,.12,'sine',.1,400);pop(hk.x,hk.y-20,f.s.leg?'LENDÁRIO!':'Fisgou!')}}}
 tension(dt,pw);
